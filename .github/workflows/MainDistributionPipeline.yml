#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (DuckDB v1.5.5 stable)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # Pin a current vcpkg baseline so Windows msys2 package URLs still resolve.
      # mongo-c-driver 1.30.3 / mongo-cxx-driver 4.0.0 are kept via vcpkg_ports overlays,
      # with cmake-4.4.patch so CMake 4.4 on macOS-15 can configure the C driver.
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  duckdb-next-build:
    name: Build extension binaries (DuckDB main)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # Pin a current vcpkg baseline so Windows msys2 package URLs still resolve.
      # mongo-c-driver 1.30.3 / mongo-cxx-driver 4.0.0 are kept via vcpkg_ports overlays,
      # with cmake-4.4.patch so CMake 4.4 on macOS-15 can configure the C driver.
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: mongo
      # Tidy check disabled because it requires MongoDB C++ driver (vcpkg dependency).
      format_checks: 'format'
